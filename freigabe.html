<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wunschkurs · Freigabe</title>
<link rel="stylesheet" href="css/karte.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f4f3f8; color: #14132b; font-family: Barlow, system-ui, sans-serif; }
  button, input, select { font: inherit; }
  .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login form { width: min(380px, 100%); background: #fff; padding: 28px; border-radius: 18px; box-shadow: 0 10px 40px rgba(20,19,43,.1); display: grid; gap: 12px; }
  .login h1 { margin: 0 0 4px; font-size: 24px; }
  .login p { margin: 0 0 6px; color: #6b6889; font-size: 14px; }
  input, select { width: 100%; padding: 12px 14px; border: 1.5px solid #dcdae8; border-radius: 10px; background: #fff; }
  .btn { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 700; cursor: pointer; background: #e9e7f3; color: #14132b; }
  .btn.prim { background: #14132b; color: #fff; }
  .btn.ok { background: #00b39e; color: #fff; }
  .btn.nein { background: #fff; border: 1.5px solid #e23b4e; color: #e23b4e; }
  .btn.klein { padding: 7px 11px; font-size: 14px; }
  .fehler { color: #e23b4e; font-size: 14px; min-height: 18px; }

  .kopf { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid #e6e4ef; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .kopf h1 { margin: 0; font-size: 20px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { border: 0; background: #f0eff6; padding: 8px 14px; border-radius: 99px; font-weight: 700; cursor: pointer; }
  .tabs button.an { background: #14132b; color: #fff; }
  .tabs b { margin-left: 4px; opacity: .65; }
  .werkzeuge { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .werkzeuge select { width: auto; padding: 8px 12px; }
  .liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; padding: 20px; }
  .eintrag { background: #fff; border-radius: 16px; padding: 10px; box-shadow: 0 4px 18px rgba(20,19,43,.07); display: grid; gap: 10px; }
  .eintrag .meta { display: flex; justify-content: space-between; font-size: 13px; color: #6b6889; padding: 0 4px; }
  .eintrag .knoepfe { display: flex; gap: 6px; }
  .eintrag .knoepfe .btn { flex: 1; }
  .leer { grid-column: 1/-1; text-align: center; color: #6b6889; padding: 60px; }
  .links { padding: 0 20px 30px; color: #6b6889; font-size: 14px; }
  .links a { color: #14132b; font-weight: 600; }
</style>
</head>
<body>
<section class="login" id="loginSeite">
  <form id="loginForm">
    <h1>Freigabe Wunschkurse</h1>
    <p>Nur für Lehrkräfte. Anmeldung mit dem Konto aus Supabase.</p>
    <input type="email" id="email" placeholder="E-Mail" autocomplete="username" required>
    <input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" required>
    <button class="btn prim" type="submit">Anmelden</button>
    <div class="fehler" id="loginFehler"></div>
  </form>
</section>

<section id="app" hidden>
  <div class="kopf">
    <h1>Wunschkurse</h1>
    <div class="tabs" id="tabs">
      <button data-st="neu" class="an">Neu<b id="zNeu"></b></button>
      <button data-st="frei">Freigegeben<b id="zFrei"></b></button>
      <button data-st="abgelehnt">Abgelehnt<b id="zAb"></b></button>
    </div>
    <div class="werkzeuge">
      <select id="klasseFilter"><option value="">Alle Klassen</option></select>
      <button class="btn klein ok" id="alleFrei">Alle neuen freigeben</button>
      <button class="btn klein" id="csv">CSV-Export</button>
      <button class="btn klein" id="abmelden">Abmelden</button>
    </div>
  </div>
  <div class="liste" id="liste"></div>
  <div class="links" id="links"></div>
</section>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/karte.js"></script>
<script>
(function () {
  const K = window.WK_KARTE, API = window.WK_API;
  const $ = s => document.querySelector(s);
  let sitzung = null, tab = "neu", klasse = "", daten = [];

  async function start() {
    sitzung = await API.sitzung();
    $("#loginSeite").hidden = !!sitzung; $("#app").hidden = !sitzung;
    if (sitzung) { await klassenLaden(); laden(); linksZeigen(); }
  }
  $("#loginForm").addEventListener("submit", async e => {
    e.preventDefault(); $("#loginFehler").textContent = "";
    try { sitzung = await API.anmelden($("#email").value.trim(), $("#pw").value); $("#pw").value = ""; start(); }
    catch (err) { $("#loginFehler").textContent = "Anmeldung fehlgeschlagen. E-Mail und Passwort prüfen."; }
  });
  $("#abmelden").onclick = () => { API.abmelden(); location.reload(); };

  async function token() {
    sitzung = await API.sitzung();
    if (!sitzung) { location.reload(); throw new Error("abgemeldet"); }
    return sitzung.token;
  }

  async function klassenLaden() {
    const ks = await API.klassen(await token());
    const sel = $("#klasseFilter"), alt = sel.value;
    sel.innerHTML = `<option value="">Alle Klassen</option>` + ks.map(k => `<option>${K.esc(k)}</option>`).join("");
    sel.value = ks.includes(alt) ? alt : "";
  }
  $("#klasseFilter").onchange = e => { klasse = e.target.value; laden(); linksZeigen(); };
  $("#tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; tab = b.dataset.st; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("an", x === b)); laden(); };

  let letzteSignatur = "";
  async function laden() {
    try {
      const t = await token();
      const alle = await API.alle(t, null, klasse);
      $("#zNeu").textContent = alle.filter(r => r.status === "neu").length || "";
      $("#zFrei").textContent = alle.filter(r => r.status === "frei").length || "";
      $("#zAb").textContent = alle.filter(r => r.status === "abgelehnt").length || "";
      daten = alle;
      const zeigen = alle.filter(r => r.status === tab);
      const sig = tab + "|" + zeigen.map(r => r.id).join(",");
      if (sig === letzteSignatur) return;
      letzteSignatur = sig;
      const liste = $("#liste"); liste.innerHTML = "";
      if (!zeigen.length) liste.innerHTML = `<div class="leer">Hier ist gerade nichts.</div>`;
      zeigen.forEach(r => {
        const e = document.createElement("div"); e.className = "eintrag";
        e.appendChild(K.render(Object.assign({}, r.karte || {}, { titel: r.titel, satz: r.satz, klasse: r.klasse })));
        const zeit = new Date(r.erstellt).toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit" });
        e.insertAdjacentHTML("beforeend", `<div class="meta"><span>${K.esc(r.klasse || "–")}</span><span>${zeit}</span></div>`);
        const kn = document.createElement("div"); kn.className = "knoepfe";
        if (r.status !== "frei") kn.insertAdjacentHTML("beforeend", `<button class="btn ok" data-a="frei">Freigeben</button>`);
        if (r.status !== "abgelehnt") kn.insertAdjacentHTML("beforeend", `<button class="btn nein" data-a="abgelehnt">${r.status === "frei" ? "Von der Wand" : "Ablehnen"}</button>`);
        if (r.status === "abgelehnt") kn.insertAdjacentHTML("beforeend", `<button class="btn nein" data-a="loeschen">Löschen</button>`);
        kn.onclick = async ev => {
          const b = ev.target.closest("button"); if (!b) return; b.disabled = true;
          try {
            if (b.dataset.a === "loeschen") { if (!confirm("Karte endgültig löschen?")) { b.disabled = false; return; } await API.loeschen(await token(), [r.id]); }
            else await API.status(await token(), [r.id], b.dataset.a);
            e.style.transition = "opacity .25s, transform .25s"; e.style.opacity = 0; e.style.transform = "scale(.95)";
            setTimeout(() => { letzteSignatur = ""; laden(); }, 250);
          } catch (err) { b.disabled = false; alert("Fehler: " + err.message); }
        };
        e.appendChild(kn); liste.appendChild(e);
      });
    } catch (err) { if (err.message !== "abgemeldet") console.warn(err); }
  }

  $("#alleFrei").onclick = async () => {
    const ids = daten.filter(r => r.status === "neu").map(r => r.id);
    if (!ids.length) return;
    if (!confirm(ids.length + " neue Karten freigeben?")) return;
    await API.status(await token(), ids, "frei"); letzteSignatur = ""; laden();
  };

  $("#csv").onclick = async () => {
    const rows = await API.alle(await token(), null, klasse);
    const z = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    const bs = r => ((r.karte && r.karte.bausteine) || []).map(b => typeof b === "string" ? (K.B_INDEX[b] || {}).label : b && b.eigen).filter(Boolean).join(", ");
    const welt = r => { const w = K.WELTEN.find(x => x.id === (r.karte && r.karte.welt)); return w ? w.name : ""; };
    const csv = ["Zeit;Klasse;Status;Titel;Untertitel;Bereich;Bausteine;Wichtigster Satz"].concat(rows.map(r =>
      [z(new Date(r.erstellt).toLocaleString("de-AT")), z(r.klasse), z(r.status), z(r.titel), z(r.karte && r.karte.untertitel), z(welt(r)), z(bs(r)), z(r.satz)].join(";"))).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
    a.download = "wunschkurse" + (klasse ? "_" + klasse : "") + "_" + new Date().toISOString().slice(0, 10) + ".csv";
    a.click();
  };

  function linksZeigen() {
    const basis = location.href.replace(/freigabe\.html.*$/, "");
    const k = klasse ? "?k=" + encodeURIComponent(klasse.toLowerCase()) : "";
    $("#links").innerHTML = `Galerie für den Beamer: <a href="${basis}galerie.html${k}" target="_blank">${basis}galerie.html${k}</a>`;
  }

  setInterval(laden, 5000);
  start();
})();
</script>
</body>
</html>
